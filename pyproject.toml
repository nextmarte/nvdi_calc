[project]
name = "nvdi-calc"
version = "0.1.0"
description = "Aplicação profissional para cálculo de NDVI usando dados de satélite abertos"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Marcus", email = "marcus@example.com"}
]
keywords = ["ndvi", "satellite", "sentinel", "landsat", "remote-sensing", "vegetation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.1.1",
    "gradio>=5.49.1",
    "leafmap>=0.53.1",
    "matplotlib>=3.10.7",
    "numpy>=2.3.3",
    "pillow>=11.3.0",
    "planetary-computer>=1.0.0",
    "plotly>=6.3.1",
    "pydeck>=0.9.1",
    "pyproj>=3.7.2",
    "pystac-client>=0.9.0",
    "rasterio>=1.4.3",
    "requests>=2.32.5",
    "scikit-image>=0.25.2",
    "shapely>=2.1.2",
    "streamlit>=1.50.0",
    "streamlit-folium>=0.25.3",
    "tqdm>=4.67.1",
    "xarray>=2025.10.1",
]

[dependency-groups]
dev = [
    "black>=25.9.0",
    "isort>=6.1.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

